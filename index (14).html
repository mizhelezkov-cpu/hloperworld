<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HloperWorld — новая эра жизни!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #110f14;
            color: #e0e0e6;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Фиолетовые трещины и лучи по бокам */
        .crack-overlay {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 150px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.8;
        }

        .crack-left {
            left: 0;
            background: radial-gradient(circle at left center, rgba(138, 43, 226, 0.4), transparent 70%);
            box-shadow: inset 20px 0 40px rgba(147, 51, 234, 0.3);
        }

        .crack-right {
            right: 0;
            background: radial-gradient(circle at right center, rgba(138, 43, 226, 0.4), transparent 70%);
            box-shadow: inset -20px 0 40px rgba(147, 51, 234, 0.3);
        }

        /* Имитация лучей, идущих к середине */
        .crack-left::before, .crack-right::before {
            content: '';
            position: absolute;
            top: 30%;
            width: 300px;
            height: 2px;
            background: linear-gradient(90deg, rgba(168, 85, 247, 0.8), transparent);
            filter: drop-shadow(0 0 15px #a855f7);
            animation: pulse-ray 4s infinite ease-in-out;
        }

        .crack-left::before {
            left: 0;
            transform: rotate(15deg);
        }

        .crack-right::before {
            right: 0;
            background: linear-gradient(-90deg, rgba(168, 85, 247, 0.8), transparent);
            transform: rotate(-15deg);
        }

        .crack-left::after, .crack-right::after {
            content: '';
            position: absolute;
            top: 65%;
            width: 250px;
            height: 3px;
            background: linear-gradient(90deg, rgba(168, 85, 247, 0.8), transparent);
            filter: drop-shadow(0 0 20px #a855f7);
            animation: pulse-ray 5s infinite ease-in-out reverse;
        }

        .crack-left::after {
            left: 0;
            transform: rotate(-10deg);
        }

        .crack-right::after {
            right: 0;
            background: linear-gradient(-90deg, rgba(168, 85, 247, 0.8), transparent);
            transform: rotate(10deg);
        }

        @keyframes pulse-ray {
            0%, 100% { opacity: 0.3; width: 200px; }
            50% { opacity: 1; width: 350px; filter: drop-shadow(0 0 25px #a855f7); }
        }

        /* Декоративные линии трещин (SVG-эффект через границы) */
        .crack-line-svg {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            stroke: #c084fc;
            stroke-width: 2;
            fill: none;
            filter: drop-shadow(0 0 8px #a855f7);
        }

        /* Основной контейнер */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 2;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 3rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.7), 0 0 40px rgba(168, 85, 247, 0.4);
            margin-bottom: 10px;
            font-weight: 800;
        }

        header p {
            font-size: 1.3rem;
            color: #a855f7;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* Переключатель вкладок */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .tab-btn {
            background: rgba(24, 20, 31, 0.8);
            border: 2px solid #3b2d54;
            color: #b1a0cd;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            border-color: #a855f7;
            color: #fff;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        .tab-btn.active {
            background: #a855f7;
            border-color: #c084fc;
            color: #fff;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
        }

        /* Сетки товаров */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .hidden {
            display: none !important;
        }

        .product-card {
            background: rgba(24, 20, 31, 0.85);
            border: 1px solid #2d2440;
            border-radius: 12px;
            padding: 25px 20px;
            text-align: center;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #a855f7;
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.2);
        }

        .product-name {
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .product-price {
            font-size: 1.6rem;
            color: #a855f7;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .buy-btn {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s ease;
        }

        .buy-btn:hover {
            opacity: 0.9;
        }

        /* Блок оформления и Корзина */
        .checkout-section {
            background: rgba(20, 16, 26, 0.9);
            border: 2px solid #3b2d54;
            border-radius: 16px;
            padding: 30px;
            max-width: 650px;
            margin: 0 auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .checkout-section h2 {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 25px;
            text-align: center;
            border-bottom: 1px solid #3b2d54;
            padding-bottom: 10px;
        }

        .cart-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: #b1a0cd;
        }

        .cart-list {
            list-style: none;
            background: rgba(12, 9, 15, 0.8);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            min-height: 60px;
        }

        .cart-empty-text {
            color: #625773;
            text-align: center;
            font-style: italic;
            padding: 10px 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(168, 85, 247, 0.1);
            color: #e0e0e6;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .remove-item-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            margin-left: 15px;
        }

        .remove-item-btn:hover {
            text-decoration: underline;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #b1a0cd;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            background: #18141f;
            border: 1px solid #3b2d54;
            padding: 12px 15px;
            color: #fff;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #a855f7;
        }

        .price-summary {
            margin: 25px 0;
            padding: 15px;
            background: rgba(168, 85, 247, 0.05);
            border-left: 4px solid #a855f7;
            border-radius: 4px;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 1.1rem;
        }

        .price-row.total {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin-top: 10px;
            border-top: 1px dashed #3b2d54;
            padding-top: 10px;
        }

        .discount-text {
            color: #10b981;
            font-size: 0.95rem;
        }

        .submit-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            border: none;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.2);
            transition: opacity 0.2s ease;
        }

        .submit-btn:hover {
            opacity: 0.95;
        }

        @media (max-width: 768px) {
            .crack-overlay {
                display: none;
            }
            header h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- Декоративные боковые трещины -->
    <div class="crack-overlay crack-left">
        <svg class="crack-line-svg" viewBox="0 0 100 1000" preserveAspectRatio="none">
            <path d="M0,0 L30,120 L10,250 L45,410 L5,580 L35,720 L15,890 L0,1000" />
            <path d="M0,200 L20,310 L5,440 L25,520 L0,630" opacity="0.5"/>
        </svg>
    </div>
    <div class="crack-overlay crack-right">
        <svg class="crack-line-svg" viewBox="0 0 100 1000" preserveAspectRatio="none">
            <path d="M100,0 L70,150 L90,290 L55,460 L95,610 L65,770 L85,910 L100,1000" />
            <path d="M100,250 L80,370 L95,490 L75,590 L100,710" opacity="0.5"/>
        </svg>
    </div>

    <div class="container">
        <header>
            <h1>HloperWorld</h1>
            <p>новая эра жизни!</p>
        </header>

        <!-- Навигация по вкладкам -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('privileges')">Привилегии</button>
            <button class="tab-btn" onclick="switchTab('cases')">Кейсы</button>
        </div>

        <!-- Категория: Привилегии -->
        <div id="tab-privileges" class="products-grid">
            <!-- Донаты генерируются через JS -->
        </div>

        <!-- Категория: Кейсы -->
        <div id="tab-cases" class="products-grid hidden">
            <!-- Кейсы генерируются через JS -->
        </div>

        <!-- Оформление заказа и Корзина -->
        <div class="checkout-section">
            <h2>Оформление заказа</h2>
            
            <div class="cart-title">Выбранные товары:</div>
            <ul id="cart-list-items" class="cart-list">
                <!-- Элементы корзины добавляются сюда -->
            </ul>

            <div class="form-group">
                <label for="player-nick">Никнейм покупателя *</label>
                <input type="text" id="player-nick" class="form-control" placeholder="Введите ваш ник в игре">
            </div>

            <div class="form-group">
                <label for="player-email">Электронная почта *</label>
                <input type="email" id="player-email" class="form-control" placeholder="example@mail.ru">
            </div>

            <div class="form-group">
                <label for="promo-code">Промокод (если есть)</label>
                <input type="text" id="promo-code" class="form-control" placeholder="Введите промокод" oninput="updatePriceDisplay()">
            </div>

            <div class="price-summary">
                <div class="price-row">
                    <span>Сумма:</span>
                    <span id="base-total">0 руб.</span>
                </div>
                <div class="price-row id-discount-row hidden">
                    <span class="discount-text">Скидка 20% (Промокод):</span>
                    <span id="discount-amount" class="discount-text">-0 руб.</span>
                </div>
                <div class="price-row total">
                    <span>Итого к оплате:</span>
                    <span id="final-total">0 руб.</span>
                </div>
            </div>

            <button type="button" class="submit-btn" onclick="processPurchase()">Приобрести выбранное</button>
        </div>
    </div>

    <script>
        // Данные всех 17 донатов (отсортированы по цене)
        const privileges = [
            { id: 'p1', name: 'Dragon', price: 5 },
            { id: 'p2', name: 'Pegas', price: 10 },
            { id: 'p3', name: 'Vampire', price: 20 },
            { id: 'p4', name: 'Moon', price: 40 },
            { id: 'p5', name: 'Shadow', price: 50 },
            { id: 'p6', name: 'God', price: 55 },
            { id: 'p7', name: 'Cobra', price: 60 },
            { id: 'p8', name: 'Purple', price: 65 },
            { id: 'p9', name: 'Ghost', price: 70 },
            { id: 'p10', name: 'Dream', price: 85 },
            { id: 'p11', name: 'D.helper', price: 110 },
            { id: 'p12', name: 'Kitsune', price: 110 },
            { id: 'p13', name: 'Delta', price: 135 },
            { id: 'p14', name: 'Hloper', price: 200 },
            { id: 'p15', name: 'Custom', price: 350 },
            { id: 'p16', name: 'D.moder', price: 350 },
            { id: 'p17', name: 'D.owner', price: 400 }
        ];

        // Данные кейсов
        const cases = [
            { id: 'c1', name: 'Кейс с риликами 1шт', price: 10 },
            { id: 'c2', name: 'Кейс с монетами 1шт', price: 15 },
            { id: 'c3', name: 'Кейс с донатом 1шт', price: 20 },
            { id: 'c4', name: 'Кейсы с риликами 3шт', price: 25 },
            { id: 'c5', name: 'Кейс с монетами 3шт', price: 40 },
            { id: 'c6', name: 'Кейс с донатом 3шт', price: 45 }
        ];

        // Текущая корзина покупателя
        let cart = [];

        // Инициализация отображения товаров на странице
        function initProducts() {
            const privContainer = document.getElementById('tab-privileges');
            const caseContainer = document.getElementById('tab-cases');

            // Очищаем и наполняем привилегии
            privContainer.innerHTML = '';
            privileges.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                const nameDiv = document.createElement('div');
                nameDiv.className = 'product-name';
                nameDiv.textContent = item.name;
                
                const priceDiv = document.createElement('div');
                priceDiv.className = 'product-price';
                priceDiv.textContent = item.price + ' руб.';
                
                const btn = document.createElement('button');
                btn.className = 'buy-btn';
                btn.textContent = 'В корзину';
                btn.onclick = function() { addToCart(item.name, item.price); };
                
                card.appendChild(nameDiv);
                card.appendChild(priceDiv);
                card.appendChild(btn);
                privContainer.appendChild(card);
            });

            // Очищаем и наполняем кейсы
            caseContainer.innerHTML = '';
            cases.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                const nameDiv = document.createElement('div');
                nameDiv.className = 'product-name';
                nameDiv.textContent = item.name;
                
                const priceDiv = document.createElement('div');
                priceDiv.className = 'product-price';
                priceDiv.textContent = item.price + ' руб.';
                
                const btn = document.createElement('button');
                btn.className = 'buy-btn';
                btn.textContent = 'В корзину';
                btn.onclick = function() { addToCart(item.name, item.price); };
                
                card.appendChild(nameDiv);
                card.appendChild(priceDiv);
                card.appendChild(btn);
                caseContainer.appendChild(card);
            });

            updateCartDisplay();
        }

        // Переключение между вкладками «Привилегии» и «Кейсы»
        function switchTab(tabName) {
            const tabButtons = document.querySelectorAll('.tab-btn');
            tabButtons.forEach(btn => btn.classList.remove('active'));

            document.getElementById('tab-privileges').classList.add('hidden');
            document.getElementById('tab-cases').classList.add('hidden');

            if (tabName === 'privileges') {
                document.getElementById('tab-privileges').classList.remove('hidden');
                event.target.classList.add('active');
            } else if (tabName === 'cases') {
                document.getElementById('tab-cases').classList.remove('hidden');
                event.target.classList.add('active');
            }
        }

        // Добавление товара в корзину
        function addToCart(name, price) {
            cart.push({ name: name, price: price });
            updateCartDisplay();
        }

        // Удаление конкретного товара из корзины по индексу
        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartDisplay();
        }

        // Обновление отображения корзины
        function updateCartDisplay() {
            const cartList = document.getElementById('cart-list-items');
            cartList.innerHTML = '';

            if (cart.length === 0) {
                const emptyLi = document.createElement('li');
                emptyLi.className = 'cart-empty-text';
                emptyLi.textContent = 'Ваша корзина пуста. Выберите донат или кейс выше!';
                cartList.appendChild(emptyLi);
            } else {
                cart.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.className = 'cart-item';
                    
                    const textSpan = document.createElement('span');
                    // Стабильная прямая конкатенация без использования служебных символов кода шаблонизатора
                    textSpan.textContent = item.name + ' — ' + item.price + ' руб.';
                    
                    const remBtn = document.createElement('button');
                    remBtn.className = 'remove-item-btn';
                    remBtn.textContent = 'Удалить';
                    remBtn.onclick = function() { removeFromCart(index); };
                    
                    li.appendChild(textSpan);
                    li.appendChild(remBtn);
                    cartList.appendChild(li);
                });
            }

            updatePriceDisplay();
        }

        // Рассчёт и обновление стоимости с учётом промокода Hloper
        function updatePriceDisplay() {
            let total = 0;
            cart.forEach(item => {
                total += item.price;
            });

            const promoInput = document.getElementById('promo-code').value.trim().toLowerCase();
            const discountRow = document.querySelector('.id-discount-row');
            
            let finalTotal = total;

            if (promoInput === 'hloper' && total > 0) {
                const discount = Math.round(total * 0.2);
                finalTotal = total - discount;
                
                document.getElementById('discount-amount').textContent = '-' + discount + ' руб.';
                discountRow.classList.remove('hidden');
            } else {
                discountRow.classList.add('hidden');
            }

            document.getElementById('base-total').textContent = total + ' руб.';
            document.getElementById('final-total').textContent = finalTotal + ' руб.';
        }

        // Обработка клика по кнопке «Приобрести выбранное»
        function processPurchase() {
            if (cart.length === 0) {
                alert('Пожалуйста, добавьте хотя бы один донат или кейс в корзину перед покупкой!');
                return;
            }

            const nick = document.getElementById('player-nick').value.trim();
            const email = document.getElementById('player-email').value.trim();

            if (!nick) {
                alert('Пожалуйста, введите ваш никнейм!');
                return;
            }

            if (!email) {
                alert('Пожалуйста, введите вашу электронную почту!');
                return;
            }

            // Формируем список купленных товаров строковым методом
            let itemsString = '';
            cart.forEach((item, idx) => {
                itemsString += '\n- ' + item.name + ' (' + item.price + ' руб.)';
            });

            const finalPriceText = document.getElementById('final-total').textContent;

            alert('Заказ успешно сформирован!\n\nНикнейм: ' + nick + '\nПочта: ' + email + '\nТовары:' + itemsString + '\n\nИтого к оплате: ' + finalPriceText + '\n\nСейчас вы будете перенаправлены на платежный шлюз (имитация).');
            
            // Очищаем форму
            cart = [];
            document.getElementById('player-nick').value = '';
            document.getElementById('player-email').value = '';
            document.getElementById('promo-code').value = '';
            updateCartDisplay();
        }

        // Запуск при старте страницы
        window.onload = initProducts;
    </script>
</body>
</html>
